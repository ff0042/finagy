[project]
name = "finagy-backend"
version = "0.1.0"
description = "FinAlly backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "pydantic>=2.9.2",
    "openai>=1.50.0",
    "httpx>=0.27.2",
    "sse-starlette>=2.1.3",
    "pytest>=8.3.3",
    "python-dotenv>=1.0.1",
    "schwabdev>=3.0.5",
    "yfinance>=1.5.2",
    "duckduckgo-search>=8.1.1",
    "apscheduler>=3.11.3",
    "twilio>=9.10.9",
]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
